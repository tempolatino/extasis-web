<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éxtasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:#0A0A0A;
    --bg-panel:#161010;
    --red-deep:#6B0000;
    --red-apple:#B0122A;
    --red-bright:#E23A4E;
    --red-glow:#FF5169;
    --white-warm:#F2ECE3;
    --text-dim:#9C8E8E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(176,18,42,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(176,18,42,0.2), transparent 45%),
      var(--bg-black);
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--white-warm);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- LOGIN ---------- */
  #loginScreen{
    width:100%;
    max-width:380px;
    background:var(--bg-panel);
    border:1px solid rgba(176,18,42,0.4);
    border-radius:18px;
    padding:40px 28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .flame{font-size:34px; margin-bottom:6px;}
  .brand{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:2px;
    color:var(--white-warm);
    text-shadow:0 0 18px rgba(226,58,78,0.6);
  }
  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--text-dim);
    font-size:16px;
    margin-top:4px;
    margin-bottom:28px;
  }
  #loginScreen input{
    width:100%;
    padding:13px 14px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:#100C0C;
    color:var(--white-warm);
    font-size:14px;
  }
  #loginScreen input:focus{outline:none; border-color:var(--red-bright);}
  #loginBtn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg, var(--red-apple), var(--red-deep));
    color:var(--white-warm);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-top:6px;
  }
  #loginBtn:hover{filter:brightness(1.1);}
  #loginError{
    color:var(--red-glow);
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- APP (post-login) ---------- */
  #app{display:none; width:100%; max-width:520px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  #logoutBtn{
    background:none; border:1px solid rgba(255,255,255,0.2); color:var(--text-dim);
    padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer;
  }
  #logoutBtn:hover{color:var(--white-warm); border-color:var(--red-bright);}

  .panel{
    background:var(--bg-panel);
    border:1px solid rgba(176,18,42,0.35);
    border-radius:18px;
    padding:30px 22px;
    text-align:center;
  }

  #wheelStage{position:relative; width:100%; max-width:420px; margin:20px auto;}
  #wheelCanvas{width:100%; height:auto; display:block; filter:drop-shadow(0 0 25px rgba(176,18,42,0.35));}
  #pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--red-bright);
    filter:drop-shadow(0 0 6px var(--red-glow));
  }
  #spinBtn{
    margin-top:10px;
    padding:14px 40px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg, var(--red-apple), var(--red-deep));
    color:var(--white-warm);
    font-weight:600;
    font-size:16px;
    letter-spacing:1px;
    cursor:pointer;
  }
  #spinBtn:hover{filter:brightness(1.1);}
  #spinBtn:disabled{opacity:0.5; cursor:default;}

  #resultModal{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.75);
    align-items:center; justify-content:center;
    z-index:50;
  }
  #resultCard{
    background:var(--bg-panel);
    border:1px solid var(--red-bright);
    border-radius:18px;
    padding:36px 30px;
    text-align:center;
    max-width:320px;
  }
  #resultText{
    font-family:'Playfair Display', serif;
    font-size:24px;
    margin:14px 0 22px;
  }
  #closeResult{
    padding:10px 26px; border:none; border-radius:24px;
    background:var(--red-apple); color:var(--white-warm); cursor:pointer;
  }

  details{margin-top:26px; text-align:left;}
  summary{cursor:pointer; color:var(--text-dim); font-size:13px; margin-bottom:12px;}
  .segRow{display:flex; gap:6px; margin-bottom:6px;}
  .segRow input{
    flex:1; padding:8px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.15);
    background:#100C0C; color:var(--white-warm); font-size:13px;
  }
  .segRow button{
    background:none; border:1px solid rgba(255,255,255,0.2); color:var(--text-dim);
    border-radius:6px; width:32px; cursor:pointer;
  }
  #updateWheelBtn{
    margin-top:10px; width:100%; padding:10px; border:none; border-radius:8px;
    background:rgba(176,18,42,0.5); color:var(--white-warm); cursor:pointer;
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="flame">🔥</div>
    <div class="brand">ÉXTASIS</div>
    <div class="tagline">Inspirando intimidad para parejas</div>
    <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div id="loginError"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <div class="flame" style="font-size:22px;">🔥 <span style="font-family:'Playfair Display',serif; font-size:18px;">ÉXTASIS</span></div>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="panel">
      <div id="wheelStage">
        <div id="pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
      </div>
      <button id="spinBtn">Girar</button>

      <details>
        <summary>Editar segmentos</summary>
        <div id="segEditor"></div>
        <button id="updateWheelBtn">Actualizar ruleta</button>
      </details>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div id="resultModal">
    <div id="resultCard">
      <div style="font-size:30px;">🔥</div>
      <div id="resultText"></div>
      <button id="closeResult">Cerrar</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // --- Config de Firebase (proyecto extasis-app) ---
  const firebaseConfig = {
    apiKey: "AIzaSyCGAPUUqXLDPEidb1cEew1gLn7PwzyNP4I",
    authDomain: "extasis-app-db2ab.firebaseapp.com",
    projectId: "extasis-app-db2ab",
    storageBucket: "extasis-app-db2ab.firebasestorage.app",
    messagingSenderId: "590269488235",
    appId: "1:590269488235:web:828c72323c0b64cb50a52e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginScreen = document.getElementById('loginScreen');
  const appScreen   = document.getElementById('app');
  const loginBtn    = document.getElementById('loginBtn');
  const logoutBtn   = document.getElementById('logoutBtn');
  const loginError  = document.getElementById('loginError');

  loginBtn.addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    loginError.textContent = '';
    signInWithEmailAndPassword(auth, email, password)
      .catch(err => {
        loginError.textContent = 'Correo o contraseña incorrectos.';
      });
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
    } else {
      loginScreen.style.display = 'block';
      appScreen.style.display = 'none';
    }
  });

  // ---------------- RULETA ----------------
  let segments = Array.from({length: 12}, (_, i) => `Opción ${i+1}`);

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const colors = ['#B0122A', '#0A0A0A'];

  function drawWheel(){
    const size = canvas.width;
    const radius = size/2;
    const angleStep = (2*Math.PI)/segments.length;
    ctx.clearRect(0,0,size,size);
    segments.forEach((label, i) => {
      const start = i*angleStep;
      const end = start+angleStep;
      ctx.beginPath();
      ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius-4, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();

      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(start+angleStep/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#F2ECE3';
      ctx.font = segments.length > 16 ? '11px Inter' : '13px Inter';
      ctx.fillText(label.length > 22 ? label.slice(0,20)+'…' : label, radius-16, 5);
      ctx.restore();
    });
  }

  function renderEditor(){
    const editor = document.getElementById('segEditor');
    editor.innerHTML = '';
    segments.forEach((label, i) => {
      const row = document.createElement('div');
      row.className = 'segRow';
      row.innerHTML = `
        <input type="text" value="${label}" data-idx="${i}">
        <button data-remove="${i}">✕</button>
      `;
      editor.appendChild(row);
    });
    editor.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        segments[e.target.dataset.idx] = e.target.value || 'Opción';
      });
    });
    editor.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', e => {
        segments.splice(e.target.dataset.remove, 1);
        renderEditor();
        drawWheel();
      });
    });
  }

  document.getElementById('updateWheelBtn').addEventListener('click', () => {
    drawWheel();
  });

  let rotation = 0;
  let spinning = false;

  document.getElementById('spinBtn').addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    const extraTurns = 6 + Math.random()*3;
    const finalAngle = Math.random()*2*Math.PI;
    const totalRotation = extraTurns*2*Math.PI + finalAngle;

    const duration = 4200;
    const startTime = performance.now();
    const startRotation = rotation;

    function animate(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration, 1);
      const eased = 1 - Math.pow(1-t, 4);
      const currentRotation = startRotation + totalRotation*eased;
      canvas.style.transform = `rotate(${currentRotation}rad)`;
      if (t < 1){
        requestAnimationFrame(animate);
      } else {
        rotation = (startRotation + totalRotation) % (2*Math.PI);
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        showResult(currentRotation);
      }
    }
    requestAnimationFrame(animate);
  });

  function showResult(finalRotationRad){
    const angleStep = (2*Math.PI)/segments.length;
    // el puntero está arriba (ángulo -90°/270°); calculamos qué segmento quedó ahí
    const normalized = ((2*Math.PI) - (finalRotationRad % (2*Math.PI)) + (Math.PI*1.5)) % (2*Math.PI);
    const index = Math.floor(normalized/angleStep) % segments.length;
    document.getElementById('resultText').textContent = segments[index];
    document.getElementById('resultModal').style.display = 'flex';
  }

  document.getElementById('closeResult').addEventListener('click', () => {
    document.getElementById('resultModal').style.display = 'none';
  });

  renderEditor();
  drawWheel();
</script>
</body>
</html>
